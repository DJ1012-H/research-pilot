server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: research-pilot
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/research_pilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:research_pilot}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      initialization-fail-timeout: -1
      maximum-pool-size: 10
      minimum-idle: 0
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s

app:
  rag:
    embedding:
      ollama:
        enabled: ${OLLAMA_EMBEDDING_ENABLED:false}
        base-url: ${OLLAMA_EMBEDDING_BASE_URL:http://127.0.0.1:11434}
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
        embedding-version: ${RAG_EMBEDDING_VERSION:qe06b-d1024-t1-c350-o30-n1}
        expected-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
        connect-timeout: ${OLLAMA_EMBEDDING_CONNECT_TIMEOUT:3s}
        read-timeout: ${OLLAMA_EMBEDDING_READ_TIMEOUT:60s}
  ai:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model-name: ${LLM_MODEL_NAME:}
    timeout: ${LLM_TIMEOUT:60s}
    max-retries: ${LLM_MAX_RETRIES:2}
    temperature: ${LLM_TEMPERATURE:0.2}
    structured-output:
      max-output-length: ${LLM_STRUCTURED_OUTPUT_MAX_LENGTH:32768}
      max-validation-retries: ${LLM_STRUCTURED_OUTPUT_MAX_RETRIES:1}
      prompt-version: ${LLM_STRUCTURED_OUTPUT_PROMPT_VERSION:search-plan-v1}
      schema-version: ${LLM_STRUCTURED_OUTPUT_SCHEMA_VERSION:search-plan-v1}
  literature:
    persistence:
      enabled: ${LITERATURE_PERSISTENCE_ENABLED:false}
    cache:
      enabled: ${LITERATURE_CACHE_ENABLED:false}
      key-prefix: ${LITERATURE_CACHE_KEY_PREFIX:research-pilot:literature:v1}
      openalex-ttl: ${OPENALEX_CACHE_TTL:15m}
      crossref-ttl: ${CROSSREF_CACHE_TTL:24h}
      not-found-ttl: ${CROSSREF_NOT_FOUND_CACHE_TTL:5m}
      failure-cooldown: ${LITERATURE_CACHE_FAILURE_COOLDOWN:30s}
      max-payload-bytes: ${LITERATURE_CACHE_MAX_PAYLOAD_BYTES:2097152}
    search:
      default-result-limit: ${LITERATURE_DEFAULT_RESULT_LIMIT:5}
      max-result-limit: ${LITERATURE_MAX_RESULT_LIMIT:15}
      candidate-multiplier: ${LITERATURE_CANDIDATE_MULTIPLIER:3}
      max-candidate-limit: ${LITERATURE_MAX_CANDIDATE_LIMIT:100}
      max-crossref-lookups-per-request: ${LITERATURE_MAX_CROSSREF_LOOKUPS:10}
      earliest-supported-year: ${LITERATURE_EARLIEST_SUPPORTED_YEAR:1900}
  research-agent:
    max-search-rounds: ${RESEARCH_AGENT_MAX_SEARCH_ROUNDS:2}
    max-plan-adjustments: ${RESEARCH_AGENT_MAX_PLAN_ADJUSTMENTS:1}
    max-business-steps: ${RESEARCH_AGENT_MAX_BUSINESS_STEPS:10}
    max-unique-candidates: ${RESEARCH_AGENT_MAX_UNIQUE_CANDIDATES:45}
    max-crossref-calls: ${RESEARCH_AGENT_MAX_CROSSREF_CALLS:45}
    max-refinement-keywords: ${RESEARCH_AGENT_MAX_REFINEMENT_KEYWORDS:5}
    max-refinement-keyword-length: ${RESEARCH_AGENT_MAX_REFINEMENT_KEYWORD_LENGTH:100}
    max-refinement-reason-length: ${RESEARCH_AGENT_MAX_REFINEMENT_REASON_LENGTH:300}
    total-timeout: ${RESEARCH_AGENT_TOTAL_TIMEOUT:90s}
  review:
    max-evidence-papers: ${REVIEW_MAX_EVIDENCE_PAPERS:20}
    max-abstract-chars: ${REVIEW_MAX_ABSTRACT_CHARS:4000}
    max-evidence-json-length: ${REVIEW_MAX_EVIDENCE_JSON_LENGTH:64000}
    max-initial-prompt-length: ${REVIEW_MAX_INITIAL_PROMPT_LENGTH:80000}
    max-raw-draft-length: ${REVIEW_MAX_RAW_DRAFT_LENGTH:16384}
    max-repair-prompt-length: ${REVIEW_MAX_REPAIR_PROMPT_LENGTH:96000}
  openalex:
    enabled: ${OPENALEX_ENABLED:false}
    base-url: ${OPENALEX_BASE_URL:https://api.openalex.org}
    api-key: ${OPENALEX_API_KEY:}
    connect-timeout: ${OPENALEX_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENALEX_READ_TIMEOUT:10s}
    default-page-size: ${OPENALEX_DEFAULT_PAGE_SIZE:25}
  crossref:
    enabled: ${CROSSREF_ENABLED:false}
    base-url: ${CROSSREF_BASE_URL:https://api.crossref.org}
    mailto: ${CROSSREF_MAILTO:}
    user-agent: ${CROSSREF_USER_AGENT:ResearchPilot/0.1}
    plus-token: ${CROSSREF_PLUS_TOKEN:}
    connect-timeout: ${CROSSREF_CONNECT_TIMEOUT:3s}
    read-timeout: ${CROSSREF_READ_TIMEOUT:10s}
    max-concurrency: ${CROSSREF_MAX_CONCURRENCY:2}
    requests-per-second: ${CROSSREF_REQUESTS_PER_SECOND:5}
    max-retries: ${CROSSREF_MAX_RETRIES:2}
    initial-backoff: ${CROSSREF_INITIAL_BACKOFF:250ms}
    max-backoff: ${CROSSREF_MAX_BACKOFF:2s}
    bibliographic-rows: ${CROSSREF_BIBLIOGRAPHIC_ROWS:5}
    verification:
      thresholds:
        title-strong-match: ${CROSSREF_VERIFICATION_TITLE_STRONG_MATCH:0.92}
        title-possible-match: ${CROSSREF_VERIFICATION_TITLE_POSSIBLE_MATCH:0.85}
        author-overlap: ${CROSSREF_VERIFICATION_AUTHOR_OVERLAP:0.60}
        source-match: ${CROSSREF_VERIFICATION_SOURCE_MATCH:0.85}
        publication-year-tolerance: ${CROSSREF_VERIFICATION_PUBLICATION_YEAR_TOLERANCE:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: ${MYSQL_ACTUATOR_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_ACTUATOR_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  file:
    name: ${RESEARCH_PILOT_LOG_FILE:logs/research-pilot.log}
  level:
    root: INFO
    com.dj1012h.researchpilot: INFO

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: research-pilot
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/research_pilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:research_pilot}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      initialization-fail-timeout: -1
      maximum-pool-size: 10
      minimum-idle: 0
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s

app:
  ai:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model-name: ${LLM_MODEL_NAME:}
    timeout: ${LLM_TIMEOUT:60s}
    max-retries: ${LLM_MAX_RETRIES:2}
    temperature: ${LLM_TEMPERATURE:0.2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: ${MYSQL_ACTUATOR_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_ACTUATOR_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: INFO
    com.dj1012h.researchpilot: INFO

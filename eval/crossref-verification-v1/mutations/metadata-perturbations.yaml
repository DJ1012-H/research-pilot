mutation_set: metadata-perturbations
mutations:
  - id: TITLE_TERMINAL_PUNCTUATION
    version: "1"
    category: EQUIVALENT
    target: candidate.title
    precondition: Candidate title is non-empty.
    operation: Add or remove terminal punctuation only.
    parameters: {}
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE
  - id: TITLE_UNICODE_HYPHEN
    version: "1"
    category: EQUIVALENT
    target: candidate.title
    precondition: Candidate title contains a hyphen-like character.
    operation: Replace a hyphen-like Unicode code point with an equivalent form.
    parameters: {}
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE
  - id: ONLINE_FIRST_YEAR
    version: "1"
    category: EXPLAINABLE
    target: candidate.publication_year
    precondition: Reviewed provenance documents online-first and print publication dates.
    operation: Substitute the documented online-first year for the print year.
    parameters: {}
    expected_effect:
      field_status: EXPLAINABLE_DIFFERENCE
      verification_status_change: POLICY_DECIDES
  - id: FIRST_AUTHOR_REPLACEMENT
    version: "1"
    category: CONFLICT
    target: candidate.authors[0]
    precondition: Candidate and reference each have a first author.
    operation: Replace the first author with a different reviewed author value.
    parameters: {}
    expected_effect:
      field_status: MISMATCHED
      verification_status_change: POLICY_DECIDES
  - id: DISTINCT_TITLE_REPLACEMENT
    version: "1"
    category: CONFLICT
    target: candidate.title
    precondition: Candidate title is non-empty.
    operation: Replace with a distinctly different reviewed title value.
    parameters: {}
    expected_effect:
      field_status: MISMATCHED
      verification_status_change: POLICY_DECIDES
  - id: TITLE_CASE_VARIANT
    version: "1"
    category: EQUIVALENT
    target: candidate.title
    precondition: Candidate title is non-empty.
    operation: Change letter case without changing title text.
    parameters:
      form: uppercase
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE
  - id: TITLE_SURROUNDING_WHITESPACE
    version: "1"
    category: EQUIVALENT
    target: candidate.title
    precondition: Candidate title is non-empty.
    operation: Add ASCII whitespace before and after the title.
    parameters:
      leading_spaces: 2
      trailing_spaces: 2
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE
  - id: TITLE_REPEATED_WHITESPACE
    version: "1"
    category: EQUIVALENT
    target: candidate.title
    precondition: Candidate title contains at least one internal ASCII space.
    operation: Replace one internal single space with repeated ASCII spaces.
    parameters:
      repeated_spaces: 2
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE

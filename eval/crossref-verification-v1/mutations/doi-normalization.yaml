mutation_set: doi-normalization
mutations:
  - id: DOI_URL_PREFIX
    version: "1"
    category: EQUIVALENT
    target: candidate.doi
    precondition: Candidate DOI is a syntactically valid normalized DOI.
    operation: Add the https://doi.org/ prefix.
    parameters: {}
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE
  - id: DOI_CASE_VARIANT
    version: "1"
    category: EQUIVALENT
    target: candidate.doi
    precondition: Candidate DOI contains alphabetic characters.
    operation: Change DOI letter case only.
    parameters: {}
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE
  - id: DOI_SURROUNDING_WHITESPACE
    version: "1"
    category: EQUIVALENT
    target: candidate.doi
    precondition: Candidate DOI is non-empty.
    operation: Add leading and trailing whitespace.
    parameters: {}
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE
  - id: DOI_LABEL_PREFIX
    version: "1"
    category: EQUIVALENT
    target: candidate.doi
    precondition: Candidate DOI is a syntactically valid normalized DOI.
    operation: Add a doi: prefix.
    parameters: {}
    expected_effect:
      field_status: MATCHED
      verification_status_change: NONE

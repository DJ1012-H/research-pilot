name: research-pilot-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: research-pilot-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - research-pilot-qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333'"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  research-pilot-qdrant-data:
    name: research-pilot-qdrant-data
